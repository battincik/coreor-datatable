name: Format lint fix

on:
  push:
    branches:
      - fix/lint-warnings

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lint-warnings
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes prettier@3.6.2 --write src/components/enterprise-grid.tsx src/components/enterprise-grid-with-drawer.tsx .oxlintrc.json
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/enterprise-grid.tsx src/components/enterprise-grid-with-drawer.tsx .oxlintrc.json
          git commit -m "style: format grid lint fixes"
          git push origin HEAD:fix/lint-warnings
